name: "asyncs review"
description: "Run asyncs sub-agent PR review and post a summary comment."
inputs:
  provider:
    description: "Review provider: openai or anthropic."
    required: false
    default: "openai"
  openai-api-key:
    description: "OpenAI API key for the review provider."
    required: false
  anthropic-api-key:
    description: "Anthropic API key for the review provider."
    required: false
  github-token:
    description: "Token used to post the review comment."
    required: false
    default: ${{ github.token }}
  model:
    description: "Model id override (defaults to the asyncs default)."
    required: false
    default: ""
  mode:
    description: "Review mode: low-noise, full, security, architecture, or testing."
    required: false
    default: ""
  agents:
    description: "Comma-separated agent kinds to run, overriding mode-based routing."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - name: Install workspace
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: bun install --frozen-lockfile
    - name: Run asyncs review
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ASYNCS_PROVIDER_INPUT: ${{ inputs.provider }}
        ASYNCS_MODEL_INPUT: ${{ inputs.model }}
        ASYNCS_MODE_INPUT: ${{ inputs.mode }}
        ASYNCS_AGENTS_INPUT: ${{ inputs.agents }}
      run: bun run apps/action/src/action-entry.ts
